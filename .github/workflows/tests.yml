name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Simulation tests (prototype/)
        working-directory: prototype
        run: python -m unittest discover -s tests -v
      - name: Network-layer tests (net/)
        working-directory: net
        run: python -m unittest discover -s tests -v
